# Arcanea Agent — safe public defaults.
# Users keep provider credentials in their own Hermes .env / auth.json.

model:
  provider: xai
  default: grok-4.3

agent:
  max_turns: 90
  tool_use_enforcement: true

memory:
  memory_enabled: true
  user_profile_enabled: true

compression:
  enabled: true

approvals:
  mode: manual

security:
  redact_secrets: true

display:
  skin: arcanea

# Hints only. Skills pick task-class models from whatever the user has configured.
routing:
  media.image: grok-build
  media.video: grok-build
  research.quick: grok-4.3
  world.canon: claude-opus-4-7
  world.character: claude-opus-4-7
  code.implement: grok-build
