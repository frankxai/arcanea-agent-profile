# Arcanea Agent — safe public defaults.
# Do not pin a provider. Users keep credentials in their own Hermes .env / auth.json.

agent:
  max_turns: 90
  tool_use_enforcement: true

memory:
  memory_enabled: true
  user_profile_enabled: true

compression:
  enabled: true

approvals:
  mode: manual

security:
  redact_secrets: true

display:
  skin: arcanea
