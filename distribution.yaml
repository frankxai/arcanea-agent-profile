name: arcanea-agent
version: 0.3.1
description: Arcanea Agent — local-first creative companion for Hermes Desktop. Worlds, characters, books, research, Content Studio cards.
hermes_requires: ">=0.16.0"
author: Frank Riemer / Arcanea
license: MIT
env_requires:
  - name: ARCANEA_SIS_HOME
    description: Optional local continuity home. Leave empty for a standalone install.
    required: false
    default: ""
distribution_owned:
  - SOUL.md
  - config.yaml
  - mcp.json
  - cards.yaml
  - skills
  - skins
  - templates
  - docs
  - desktop-plugins
  - README.md
  - distribution.yaml
source: github.com/frankxai/arcanea-agent-profile
